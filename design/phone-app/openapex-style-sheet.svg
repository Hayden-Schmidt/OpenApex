<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Montserrat, sans-serif">
  <rect width="1200" height="900" fill="#0B0B0B"/>
  <text x="40" y="60" fill="#FFFFFF" font-size="32">OpenApex style sheet</text>
  <text x="40" y="88" fill="#969696" font-size="14">Extracted from firmware/gui. Tokens: openapex.tokens.json</text>

  <text x="40" y="140" fill="#969696" font-size="14">COLOUR</text>
  <g font-size="12">
    <rect x="40" y="155" width="120" height="80" rx="4" fill="#00FFE8"/><text x="40" y="255" fill="#FFF">accent #00FFE8</text>
    <rect x="180" y="155" width="120" height="80" rx="4" fill="#000000" stroke="#333"/><text x="180" y="255" fill="#FFF">background #000000</text>
    <rect x="320" y="155" width="120" height="80" rx="4" fill="#FFFFFF"/><text x="320" y="255" fill="#FFF">text #FFFFFF</text>
    <rect x="460" y="155" width="120" height="80" rx="4" fill="#969696"/><text x="460" y="255" fill="#FFF">secondary #969696</text>
    <rect x="600" y="155" width="120" height="80" rx="4" fill="#808080"/><text x="600" y="255" fill="#FFF">stale #808080</text>
    <rect x="740" y="155" width="120" height="80" rx="4" fill="#E3E3E3"/><text x="740" y="255" fill="#FFF">icon #E3E3E3</text>
    <rect x="880" y="155" width="120" height="80" rx="4" fill="#1A1A1A" stroke="#333"/><text x="880" y="255" fill="#FFF">outline #1A1A1A</text>

    <rect x="40" y="280" width="120" height="80" rx="4" fill="#1E8D3E"/><text x="40" y="380" fill="#FFF">success #1E8D3E</text>
    <rect x="180" y="280" width="120" height="80" rx="4" fill="#FF3B30"/><text x="180" y="380" fill="#FFF">north #FF3B30</text>
    <rect x="320" y="280" width="120" height="80" rx="4" fill="#585F68"/><text x="320" y="380" fill="#FFF">neutral #585F68</text>
    <rect x="460" y="280" width="120" height="80" rx="4" fill="#009AA6"/><text x="460" y="380" fill="#FFF">traffic free #009AA6</text>
    <rect x="600" y="280" width="120" height="80" rx="4" fill="#F5A623"/><text x="600" y="380" fill="#FFF">slow #F5A623</text>
    <rect x="740" y="280" width="120" height="80" rx="4" fill="#E0392B"/><text x="740" y="380" fill="#FFF">heavy #E0392B</text>
    <rect x="880" y="280" width="120" height="80" rx="4" fill="#8B1A12"/><text x="880" y="380" fill="#FFF">stopped #8B1A12</text>
  </g>

  <text x="40" y="430" fill="#969696" font-size="14">TYPE (Montserrat Regular, terminal px @240)</text>
  <g fill="#FFFFFF">
    <text x="40" y="485" font-size="44">12:55</text><text x="200" y="485" font-size="12" fill="#969696">display 44</text>
    <text x="40" y="535" font-size="38">042.7</text><text x="200" y="535" font-size="12" fill="#969696">headline 38</text>
    <text x="40" y="578" font-size="28">330° NW</text><text x="200" y="578" font-size="12" fill="#969696">title 28</text>
    <text x="40" y="615" font-size="24">350 m</text><text x="200" y="615" font-size="12" fill="#969696">body 24</text>
    <text x="40" y="648" font-size="20">Odometer</text><text x="200" y="648" font-size="12" fill="#969696">label 20</text>
    <text x="40" y="678" font-size="16">Queen Street</text><text x="200" y="678" font-size="12" fill="#969696">caption 16</text>
    <text x="40" y="705" font-size="14" fill="#808080">ETA 13:42</text><text x="200" y="705" font-size="12" fill="#969696">micro 14</text>
  </g>

  <text x="420" y="430" fill="#969696" font-size="14">SHAPE</text>
  <rect x="420" y="450" width="40" height="40" rx="4" fill="none" stroke="#FFF" stroke-width="2"/>
  <text x="470" y="475" fill="#969696" font-size="12">box r4, stroke 2</text>
  <rect x="420" y="510" width="111" height="30" rx="15" fill="#00FFE8"/>
  <text x="545" y="530" fill="#969696" font-size="12">pill bubble 111×30</text>
  <circle cx="480" cy="640" r="56" fill="none" stroke="#585F68" stroke-width="7"/>
  <path d="M 440 680 A 56 56 0 0 1 480 584" fill="none" stroke="#009AA6" stroke-width="7" stroke-linecap="round"/>
  <text x="545" y="645" fill="#969696" font-size="12">ring stroke 7 @240</text>

  <text x="760" y="430" fill="#969696" font-size="14">MOTION</text>
  <g fill="#FFFFFF" font-size="13">
    <text x="760" y="465">fast 400ms: fades, glyph slides</text>
    <text x="760" y="490">medium 600ms: text slide-in</text>
    <text x="760" y="515">slow 900ms: hero element entry</text>
    <text x="760" y="540">tween 1000ms: state change</text>
    <text x="760" y="565">reveal 2000ms / min hold</text>
    <text x="760" y="605" fill="#00FFE8">Never linear. S-curve or exponential.</text>
    <text x="760" y="630" fill="#00FFE8">Exit = entry reversed.</text>
    <text x="760" y="655" fill="#00FFE8">Hold times are floors, not delays.</text>
  </g>

  <text x="40" y="780" fill="#969696" font-size="14">PRINCIPLES</text>
  <text x="40" y="810" fill="#FFFFFF" font-size="14">High contrast on true black · one accent colour, themeable · semantic colours never follow the theme · Material Symbols icons (outlined, wght 400)</text>
</svg>

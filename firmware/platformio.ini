; This firmware project stands alone: there is no repo-root platformio.ini anymore. Build with
; `pio run -d firmware -e prototype_c3` from the repo root, or via idf.py directly (see
; firmware/README.md and ".vscode/tasks.json" "Firmware: build C3").
[platformio]
default_envs = prototype_c3
src_dir = main

; Production/default build. Note `default_envs` above deliberately names ONLY this env, so a bare
; `pio run -d firmware` can never produce a drive-logging binary.
[env:prototype_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_port = COM5
build_flags = -DBOARD_PROFILE_PROTOTYPE_C3_GC9A01=1

; Development-only build: identical to prototype_c3 plus the on-flash drive logger (see
; firmware/main/drive_log.h). Must be selected explicitly:
;   pio run -d firmware -e prototype_c3_devlog -t upload
; Never ship this env -- it records the rider's route to flash and burns write cycles.
[env:prototype_c3_devlog]
extends = env:prototype_c3
build_flags = ${env:prototype_c3.build_flags} -DOPENAPEX_DRIVE_LOG=1

; Development-only build: the mesh serial console (firmware/main/mesh_console.h) for driving a
; screenless terminal and logging free heap. Must be selected explicitly; never ship this env.
;   pio run -d firmware -e prototype_c3_meshdev -t upload --upload-port COMxx
[env:prototype_c3_meshdev]
extends = env:prototype_c3
build_flags = ${env:prototype_c3.build_flags} -DOPENAPEX_MESH_CONSOLE=1

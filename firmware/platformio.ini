; Nested PlatformIO project for the C3 firmware target. Separate from the repo-root
; platformio.ini because PlatformIO only supports one src_dir per project, and this target's
; source tree (main/) is disjoint from the native/simulator target's (simulator/native/).
; Build with `pio run -d firmware -e prototype_c3` from the repo root, or via idf.py directly
; (see firmware/README.md and ".vscode/tasks.json" "Firmware: build C3").
[platformio]
default_envs = prototype_c3
src_dir = main

[env:prototype_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_port = COM5
build_flags = -DBOARD_PROFILE_PROTOTYPE_C3_GC9A01=1

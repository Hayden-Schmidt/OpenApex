; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sim_lvgl
src_dir = src

[env:sim_lvgl]
platform = native
build_src_filter = +<*> +<../../gui/*.cpp>
build_flags = 
	-std=c++17
	-DBOARD_PROFILE_PROTOTYPE_C3_GC9A01=1
	-DLV_CONF_INCLUDE_SIMPLE=1
	-Iinclude
	-Ithird_party/SDL2_include
	-I../main
	-I../gui
	-Lthird_party/SDL2_lib
	-lmingw32
	-lSDL2main
	-lSDL2
lib_deps = 
	lvgl/lvgl@^9.6.0
extra_scripts = pre:fix_mingw_path.py, pre:guard_shared_objs.py, post:post_build.py
platform_packages = platformio/toolchain-gccmingw32@^1.50100.0

[env:sim_lvgl_s3]
platform = native
build_src_filter = +<*> +<../../gui/*.cpp>
build_flags = 
	-std=c++17
	-DBOARD_PROFILE_S3_AMOLED_175=1
	-DLV_CONF_INCLUDE_SIMPLE=1
	-Iinclude
	-Ithird_party/SDL2_include
	-I../main
	-I../gui
	-Lthird_party/SDL2_lib
	-lmingw32
	-lSDL2main
	-lSDL2
lib_deps = 
	lvgl/lvgl@^9.6.0
extra_scripts = pre:fix_mingw_path.py, pre:guard_shared_objs.py, post:post_build.py
platform_packages = platformio/toolchain-gccmingw32@^1.50100.0

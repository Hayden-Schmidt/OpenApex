; Hardware-less LVGL + SDL PC simulator target. Lets GUI screens be designed/pixel-tested at the
; exact target display resolution (see ../main/board_profile.h) before physical hardware arrives.
; Separate nested PlatformIO project (its own src_dir) for the same reason firmware/platformio.ini
; and the repo-root platformio.ini are separate: PlatformIO only supports one src_dir per project.
; Two envs share one gui_app.cpp/DialScreen build, one per board profile/tier (§16.6), so both
; windows can be run side by side while designing Layer 1 content:
;   pio run -d firmware/sim_lvgl -e sim_lvgl && .pio\build\sim_lvgl\program.exe        (C3, 240x240, BASIC)
;   pio run -d firmware/sim_lvgl -e sim_lvgl_s3 && .pio\build\sim_lvgl_s3\program.exe  (S3, 466x466, RICH)
[platformio]
default_envs = sim_lvgl
src_dir = src

[env:sim_lvgl]
platform = native
; firmware/gui is a sibling directory (its own ESP-IDF component for the real build -- see
; firmware/gui/CMakeLists.txt), pulled into this PlatformIO target's single src_dir via
; build_src_filter instead of the previous single-file textual #include bridge.
build_src_filter = +<*> +<../../gui/*.cpp>
build_flags =
    -std=c++17
    -DBOARD_PROFILE_PROTOTYPE_C3_GC9A01=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
    -Ithird_party/SDL2_include
    -I../main
    -I../gui
    -Lthird_party/SDL2_lib
    -lmingw32
    -lSDL2main
    -lSDL2
lib_deps =
    lvgl/lvgl@^9.6.0
extra_scripts = pre:fix_mingw_path.py, post:post_build.py

[env:sim_lvgl_s3]
platform = native
build_src_filter = +<*> +<../../gui/*.cpp>
build_flags =
    -std=c++17
    -DBOARD_PROFILE_S3_AMOLED_175=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
    -Ithird_party/SDL2_include
    -I../main
    -I../gui
    -Lthird_party/SDL2_lib
    -lmingw32
    -lSDL2main
    -lSDL2
lib_deps =
    lvgl/lvgl@^9.6.0
extra_scripts = pre:fix_mingw_path.py, post:post_build.py

; Hardware-less LVGL + SDL PC simulator target. Lets GUI screens be designed/pixel-tested at the
; exact target display resolution (see ../main/board_profile.h) before physical hardware arrives.
; Separate nested PlatformIO project (its own src_dir) for the same reason firmware/platformio.ini
; and the repo-root platformio.ini are separate: PlatformIO only supports one src_dir per project.
; Build/run with `pio run -d firmware/sim_lvgl -e sim_lvgl -t exec` (see README note below), or:
;   pio run -d firmware/sim_lvgl -e sim_lvgl
;   .pio\build\sim_lvgl\program.exe
[platformio]
default_envs = sim_lvgl
src_dir = src

[env:sim_lvgl]
platform = native
build_flags =
    -std=c++17
    -DBOARD_PROFILE_PROTOTYPE_C3_GC9A01=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
    -Ithird_party/SDL2_include
    -I../main
    -I../gui
    -Lthird_party/SDL2_lib
    -lmingw32
    -lSDL2main
    -lSDL2
lib_deps =
    lvgl/lvgl@^9.6.0
extra_scripts = post:post_build.py

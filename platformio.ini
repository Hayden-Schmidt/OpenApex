; This project's src_dir is the native/simulator target only. The C3 firmware target is a separate
; nested PlatformIO project at firmware/platformio.ini (its own src_dir = main), because PlatformIO
; only supports one src_dir per project and the two targets compile disjoint source trees. Build it
; with `pio run -d firmware -e prototype_c3`, or via idf.py directly (see firmware/README.md and
; ".vscode/tasks.json" "Firmware: build C3"). Keep both build paths working; do not let them diverge.
[platformio]
default_envs = native
src_dir = simulator/native

[env:native]
platform = native
build_flags = -std=c++17

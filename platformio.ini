; The C3 firmware target builds through idf.py directly (see firmware/README.md and the
; ".vscode/tasks.json" "Firmware: build C3" task), not through a PlatformIO espidf environment —
; firmware/ is a hand-rolled ESP-IDF CMake project, and a PlatformIO espidf env expects to own
; project structure. Only the native/simulator target is a real PlatformIO environment.
[platformio]
default_envs = native
src_dir = simulator/native

[env:native]
platform = native
build_flags = -std=c++17
